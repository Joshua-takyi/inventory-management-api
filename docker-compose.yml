services:
  db:
    image: postgres:16-alpine
    container_name: stockflow-api
    restart: "unless-stopped"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=stockflow
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
